# Build xfig-qt on macOS and Linux, and run the headless smoke test.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt fontconfig freetype libpng jpeg-turbo libtiff fig2dev ghostscript
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build -j4
      - name: Smoke test
        run: SMOKE_OUT=smoke tests/smoke_test.sh build/xfig.app/Contents/MacOS/xfig
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: smoke
      - name: Install
        run: cmake --install build --prefix "$PWD/inst"

  linux:
    # Ubuntu's own Qt (6.4): what Linux distributions ship, not the newest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            qt6-base-dev qt6-qpa-plugins libfontconfig-dev libfreetype-dev \
            libpng-dev libjpeg-dev libtiff-dev libcups2-dev \
            fig2dev ghostscript fonts-urw-base35
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Smoke test
        run: SMOKE_OUT=smoke tests/smoke_test.sh build/xfig
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: smoke
      - name: Install
        run: cmake --install build --prefix "$PWD/inst"
